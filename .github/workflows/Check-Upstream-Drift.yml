name: Upstream Drift Watch

# Read-only Tier-1 maintenance: reports when upstream sources move past what
# the tree was proven good against. Commits nothing, builds nothing, releases
# nothing. Red (exit 1) means "act on the summary": for kernel/vendor/vold
# that is refresh + device-test decrypt, for foxcli a fork merge, and for the
# manifest only when upstream becomes anonymous-fetchable again (plain
# manifest drift is reported, not red). Recovery-fork and kernel-fork drift
# is info only - triage / rebase, not a release blocker. Green means "no
# drift".
#
# Anchors (bump after the corresponding action):
# - KERNEL_BASE: LOS kernel commit our dtb/recovery_dtbo blobs were extracted
#   from (proven decrypting). The kernel Image itself is built from our own
#   fork now, so drift here means the blob source moved.
# - VENDOR_SINCE: date our recovery/root blobs were proven good.
# - VOLDS_BASE: OrangeFox system/vold commit our fork was cut from.
# - RECOVERY_BASE: OrangeFox bootable/Recovery commit our fork was cut from
#   (bump after reviewing new upstream commits for cherry-picks).
# - MANIFEST_PIN: giou/Manifest fox_16.0 commit we build from (pinned because
#   upstream's 2026-10-18 fox.xml pins projects anonymous builds cannot
#   fetch).
# - FOXCLI_BASE: OrangeFox external/foxcli commit giou/foxcli was forked at.
# Vendor queries are pinned to lineage-24.0 (what the tree consumes);
# SPL bumps are NOT drift (2099 policy absorbs them) and are ignored here.
#
# Covers the decrypt-critical set: dtb/recovery_dtbo (LOS boot image source),
# gatekeeper/keymaster/qseecomd + vintf blobs (TheMuppets vendor) - plus the
# forks we carry (vold, foxcli, bootable/recovery, the kernel) and the
# manifest pin.

on:
  schedule:
    # Monday 07:00 UTC - after the weekend LOS weeklies
    - cron: '0 7 * * 1'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  drift:
    name: Check upstream drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      KERNEL_BASE: 6b34d24765327d746074c8e53b5ad0d24a51acc7
      KERNEL_BRANCH: lineage-24.0
      VENDOR_SINCE: 2026-10-12
      VOLDS_BASE: 953de9608eb78380b3c4e39e801c2bc0af7dbddc
      RECOVERY_BASE: 0f7831d3240f4c3925a0b5fd7d2c907ddf8704c2
      MANIFEST_PIN: cba4ceb595fed927b21111c1483c7bbf87e3def4
      FOXCLI_BASE: ce8125d5dba50b3c03e8c674221206bb7ce5c705
    steps:
      - name: Check for drift
        run: |
          set -euo pipefail
          DRIFT=0
          echo "# Upstream drift check ($(date -u +%F))" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"

          echo "=== kernel: ${KERNEL_BASE}...${KERNEL_BRANCH} ==="
          curl -sfL --retry 3 "https://api.github.com/repos/LineageOS/android_kernel_xiaomi_sm8250/compare/${KERNEL_BASE}...${KERNEL_BRANCH}" -o /tmp/kernel-compare.json
          AHEAD=$(python3 -c "import json; print(json.load(open('/tmp/kernel-compare.json')).get('ahead_by', '?'))")
          echo "kernel commits ahead of snapshot: ${AHEAD}"
          if [[ "${AHEAD}" != "0" ]]; then
            DRIFT=1
            python3 -c "
          import json
          d = json.load(open('/tmp/kernel-compare.json'))
          print('#### Kernel DRIFT: %s new commit(s)' % d.get('ahead_by'))
          for c in d.get('commits', [])[:15]:
              print('- %s %s %s' % (c['sha'][:8], c['commit']['author']['date'][:10], c['commit']['message'].splitlines()[0][:90]))
          " | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "- Kernel: no drift (snapshot == HEAD)" >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "=== vendor repos since ${VENDOR_SINCE} ==="
          for repo in proprietary_vendor_xiaomi_apollon proprietary_vendor_xiaomi_sm8250-common; do
            echo "--- TheMuppets/${repo} ---"
            curl -sfL --retry 3 "https://api.github.com/repos/TheMuppets/${repo}/commits?sha=lineage-24.0&since=${VENDOR_SINCE}T00:00:00Z&per_page=20" -o "/tmp/vendor-${repo}.json"
            N=$(python3 -c "import json; print(len(json.load(open('/tmp/vendor-${repo}.json'))))")
            echo "commits since anchor: ${N}"
            if [[ "${N}" != "0" ]]; then
              DRIFT=1
              {
                echo "#### Vendor DRIFT: TheMuppets/${repo} (${N} commit(s) since ${VENDOR_SINCE})"
                python3 -c "
          import json
          for c in json.load(open('/tmp/vendor-${repo}.json'))[:10]:
              print('- %s %s %s' % (c['sha'][:8], c['commit']['author']['date'][:10], c['commit']['message'].splitlines()[0][:90]))
          "
              } | tee -a "${GITHUB_STEP_SUMMARY}"
            else
              echo "- Vendor ${repo}: no drift" >> "${GITHUB_STEP_SUMMARY}"
            fi
          done

          echo "=== system/vold (fork base vs OrangeFox upstream) ==="
          curl -sfL --retry 3 "https://gitlab.com/api/v4/projects/OrangeFox%2Fsystem%2Fvold/repository/compare?from=${VOLDS_BASE}&to=fox_16.0" -o /tmp/vold-compare.json
          VN=$(python3 -c "import json; print(len(json.load(open('/tmp/vold-compare.json')).get('commits', [])))")
          echo "system/vold commits upstream since fork base: ${VN}"
          if [[ "${VN}" != "0" ]]; then
            DRIFT=1
            {
              echo "#### system/vold DRIFT: ${VN} commit(s) upstream since our fork base"
              echo "     (merge into giou/android_system_vold, then bump VOLDS_BASE)"
              python3 -c "
          import json
          for c in json.load(open('/tmp/vold-compare.json')).get('commits', [])[:15]:
              print('- %s %s %s' % (c['short_id'], c['created_at'][:10], c['title'][:90]))
          "
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "- system/vold: no drift (fork base == upstream tip)" >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "=== recovery fork (giou/Recovery) vs OrangeFox fox_16.0 ==="
          curl -sfL --retry 3 "https://gitlab.com/api/v4/projects/OrangeFox%2Fbootable%2FRecovery/repository/compare?from=${RECOVERY_BASE}&to=fox_16.0" -o /tmp/recovery-compare.json
          RN=$(python3 -c "import json; print(len(json.load(open('/tmp/recovery-compare.json')).get('commits', [])))")
          echo "upstream recovery commits since our fork point: ${RN}"
          if [[ "${RN}" != "0" ]]; then
            {
              echo "#### Recovery fork drift (info): ${RN} upstream commit(s) since ${RECOVERY_BASE:0:8}"
              echo "     (review for cherry-picks; bump RECOVERY_BASE once reviewed)"
              python3 -c "
          import json
          for c in json.load(open('/tmp/recovery-compare.json')).get('commits', [])[:15]:
              print('- %s %s %s' % (c['short_id'], c['created_at'][:10], c['title'][:90]))
          "
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "- Recovery fork: no drift (fork point == upstream tip)" >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "=== kernel fork (lineage-24.0-apollon) vs LOS lineage-24.0 ==="
          curl -sfL --retry 3 "https://api.github.com/repos/LineageOS/android_kernel_xiaomi_sm8250/compare/lineage-24.0...giou:lineage-24.0-apollon" -o /tmp/kernel-fork-compare.json
          KB=$(python3 -c "import json; print(json.load(open('/tmp/kernel-fork-compare.json')).get('behind_by', '?'))")
          echo "kernel fork commits behind LOS: ${KB}"
          if [[ "${KB}" != "0" ]]; then
            {
              echo "#### Kernel fork drift (info): ${KB} LOS commit(s) not in lineage-24.0-apollon"
              echo "     (rebase the apollon patches onto LOS before the next release)"
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "- Kernel fork: in sync with LOS (ahead by the apollon patches only)" >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "=== OrangeFox manifest: upstream vs our pin ==="
          curl -sfL --retry 3 "https://gitlab.com/api/v4/projects/OrangeFox%2FManifest/repository/compare?from=${MANIFEST_PIN}&to=fox_16.0" -o /tmp/manifest-compare.json
          MN=$(python3 -c "import json; print(len(json.load(open('/tmp/manifest-compare.json')).get('commits', [])))")
          echo "upstream manifest commits since our pin: ${MN}"
          if [[ "${MN}" != "0" ]]; then
            {
              echo "#### Manifest drift (info): ${MN} upstream commit(s) since our pin"
              python3 -c "
          import json
          for c in json.load(open('/tmp/manifest-compare.json')).get('commits', [])[:15]:
              print('- %s %s %s' % (c['short_id'], c['created_at'][:10], c['title'][:90]))
          "
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "- Manifest: no drift (pin == upstream tip)" >> "${GITHUB_STEP_SUMMARY}"
          fi
          # The pin exists only because upstream's fox.xml pins projects that
          # anonymous builds cannot fetch. Red the day that stops being true:
          # probe every OrangeFox-remote project in upstream's current XMLs.
          curl -sfL --retry 3 "https://gitlab.com/api/v4/projects/OrangeFox%2FManifest/repository/tree?ref=fox_16.0&per_page=100" -o /tmp/manifest-tree.json
          CHECKED=0; BLOCKED=0
          while read -r mf; do
            curl -sfL --retry 3 "https://gitlab.com/api/v4/projects/OrangeFox%2FManifest/repository/files/${mf}/raw?ref=fox_16.0" -o /tmp/mf.xml || continue
            while read -r proj; do
              [ -z "${proj}" ] && continue
              CHECKED=$((CHECKED + 1))
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://gitlab.com/OrangeFox/${proj}.git/info/refs?service=git-upload-pack" || echo 000)
              if [ "${code}" != "200" ]; then
                BLOCKED=$((BLOCKED + 1))
                echo "  blocked: ${proj} (HTTP ${code})"
              fi
            done < <(grep 'remote="OrangeFox"' /tmp/mf.xml | grep -o 'name="[^"]*"' | sed 's/name="//;s/"$//' | sort -u)
          done < <(python3 -c "import json; [print(f['name']) for f in json.load(open('/tmp/manifest-tree.json')) if f['name'].endswith('.xml')]")
          echo "manifest projects probed: ${CHECKED}, blocked: ${BLOCKED}"
          if [ "${CHECKED}" != "0" ] && [ "${BLOCKED}" = "0" ]; then
            DRIFT=1
            {
              echo "#### Upstream manifest is anonymous-fetchable again"
              echo "     Action: advance giou/Manifest to upstream fox_16.0 and"
              echo "     drop the CI repoint in OrangeFox-Compile.yml."
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "- Manifest fetchability: ${BLOCKED}/${CHECKED} OrangeFox project(s) still blocked (pin needed)" >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "=== foxcli fork (giou/foxcli) vs upstream ==="
          curl -sfL --retry 3 "https://gitlab.com/api/v4/projects/OrangeFox%2Fexternal%2Ffoxcli/repository/compare?from=${FOXCLI_BASE}&to=master" -o /tmp/foxcli-compare.json
          FN=$(python3 -c "import json; print(len(json.load(open('/tmp/foxcli-compare.json')).get('commits', [])))")
          echo "upstream foxcli commits since our fork base: ${FN}"
          if [[ "${FN}" != "0" ]]; then
            DRIFT=1
            {
              echo "#### foxcli DRIFT: ${FN} upstream commit(s) since the fork base"
              echo "     (merge into giou/foxcli master; the CI pins the fork, so the"
              echo "     next build picks it up - no device test needed)"
              python3 -c "
          import json
          for c in json.load(open('/tmp/foxcli-compare.json')).get('commits', [])[:15]:
              print('- %s %s %s' % (c['short_id'], c['created_at'][:10], c['title'][:90]))
          "
            } | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "- foxcli: no drift (fork base == upstream tip)" >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "=== latest LOS nightly (info only) ==="
          curl -sfL --retry 3 "https://download.lineageos.org/api/v2/devices/apollon/builds" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('latest nightly:', (d[0].get('date') if isinstance(d,list) and d else d))" \
            | tee -a "${GITHUB_STEP_SUMMARY}"

          if [[ "${DRIFT}" != "0" ]]; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "## Action: apply the per-source action in the drift entries above" >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Upstream drift detected - see the summary. kernel/vendor: refresh blobs + device-test decrypt, then bump the anchor; vold/foxcli: merge the fork; manifest: advance giou/Manifest + drop the CI repoint."
            exit 1
          fi
          echo "No drift. Tree is current."

name: OrangeFox - Build

# Apolon-specific builder: this workflow only ever builds OrangeFox 16.0
# recovery for Xiaomi apollon from THIS tree.
#
# The dispatched branch picks the PRIMARY variant: fox_16.0-wlan builds the
# wlan stack (its assets are tagged -wlan), fox_16.0 builds the mainline
# recovery (plain asset names). Input 'build': both = also build the sibling
# variant in this same runner (incremental - manifest/kernel/objects are
# shared, so the second variant is NOT a from-scratch compile); single = this
# branch's variant only. Bump FOX_MAINTAINER_PATCH_VERSION in fox_apollon.mk
# before dispatching.
#
# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for the original Recovery Builder Template
# And all Contributors in every repositories used

run-name: OrangeFox 16.0 for apollon (recovery)

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'both variants, or this branch only'
        type: choice
        options: [both, single]
        default: both
      probe:
        description: 'measurement-only run that stops after the kernel step'
        type: choice
        options: [none, kernel-ccache, of-ccache]
        default: none
      runner:
        description: 'where to build: GitHub-hosted VM, or the local WSL runner (label of-wsl)'
        type: choice
        options: [hosted, self-hosted]
        default: hosted
      sync_jobs:
        description: 'repo sync clone concurrency (measured 2026-10-17: 8 and 16 land at the fast end of the j4 spread; 16 is no better than 8)'
        type: choice
        options: ['4', '8', '16']
        default: '8'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    # ubuntu-24.04: the newest image every step supports (slimhub_actions
    # handles 22.04/24.04 only - 26.04 would break the cleanup step; the
    # OrangeFox build-env script explicitly supports 24.04). Newer kernel =
    # better behavior under the build's memory pressure than the 22.04 image.
    # runner=self-hosted builds on the local WSL2 runner (label of-wsl): no
    # runner-loss risk, an incremental repo sync, and a persistent ccache;
    # the hosted-only setup steps below are skipped there.
    runs-on: ${{ inputs.runner == 'self-hosted' && 'of-wsl' || 'ubuntu-24.04' }}
    timeout-minutes: 720
    permissions:
      contents: write
    env:
      MANIFEST_BRANCH: '16.0'
      DEVICE_TREE_BRANCH: 'fox_16.0'
      DEVICE_PATH: 'device/xiaomi/apollon'
      DEVICE_NAME: 'apollon'
      BUILD_TARGET: 'recovery'
      DEVICE_TREE: 'https://github.com/giou/device_xiaomi_apollon'
      ALLOW_MISSING_DEPENDENCIES: 'true'
      DEBIAN_FRONTEND: noninteractive
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned 2026-10-17 (node24: silences the punycode/url.parse deprecations)
      with:
        # Never git-clean the workspace. On self-hosted the persistent
        # OrangeFox/ tree lives inside it, and checkout's default
        # `git clean -ffdx` deletes the whole 70+ GB sync: run 39182285978
        # re-synced from zero because of this.
        clean: false

    - name: Validate config
      run: |
        set -euo pipefail
        echo "Manifest: fox_${MANIFEST_BRANCH}"
        echo "Device tree: ${DEVICE_TREE} @ ${DEVICE_TREE_BRANCH}"
        echo "Device path: ${DEVICE_PATH}"
        echo "Device: ${DEVICE_NAME}"

        # Basic sanity: DEVICE_PATH must look like device/<vendor>/<codename>
        # and must not contain '..' (path traversal).
        if [[ "${DEVICE_PATH}" == *".."* ]]; then
          echo "::error::DEVICE_PATH must not contain '..': ${DEVICE_PATH}"
          exit 1
        fi
        if [[ "${DEVICE_PATH}" != device/*/* ]]; then
          echo "::error::DEVICE_PATH should look like 'device/<vendor>/<codename>', got: ${DEVICE_PATH}"
          exit 1
        fi

        # Fail fast if the device-tree repo/branch does not exist.
        # This is the step that previously failed late with cryptic "exit code 128".
        if ! git ls-remote --heads "${DEVICE_TREE}" "${DEVICE_TREE_BRANCH}" | grep -q .; then
          echo "::error::Branch '${DEVICE_TREE_BRANCH}' not found in ${DEVICE_TREE}."
          echo "Available branches:"
          git ls-remote --heads "${DEVICE_TREE}" | awk '{print $2}' | sed 's|refs/heads/||' || true
          echo ""
          echo "Tree constants in this file are wrong - fix and re-run."
          exit 1
        fi
        echo "Input validation passed."

        # Variant naming: the branch decides the primary variant; the sibling
        # build derives from it. -wlan assets carry the WLAN/network features.
        VARIANT="mainline"
        [[ "${GITHUB_REF_NAME}" == *wlan* ]] && VARIANT="wlan"
        if [[ "${VARIANT}" == "wlan" ]]; then
          VARIANT_SUFFIX="-wlan"
          OTHER_VARIANT="mainline"
          OTHER_DT_BRANCH="fox_16.0"
          OTHER_FORK_BRANCH="fox_16.0-apollon"
          OTHER_SUFFIX=""
        else
          VARIANT_SUFFIX=""
          OTHER_VARIANT="wlan"
          OTHER_DT_BRANCH="fox_16.0-wlan"
          OTHER_FORK_BRANCH="fox_16.0-apollon-wlan"
          OTHER_SUFFIX="-wlan"
        fi
        echo "Primary variant: ${VARIANT} (asset suffix '${VARIANT_SUFFIX}')"
        echo "Other variant:   ${OTHER_VARIANT} (asset suffix '${OTHER_SUFFIX}')"
        echo "VARIANT_SUFFIX=${VARIANT_SUFFIX}" >> "${GITHUB_ENV}"
        echo "OTHER_VARIANT=${OTHER_VARIANT}" >> "${GITHUB_ENV}"
        echo "OTHER_DT_BRANCH=${OTHER_DT_BRANCH}" >> "${GITHUB_ENV}"
        echo "OTHER_FORK_BRANCH=${OTHER_FORK_BRANCH}" >> "${GITHUB_ENV}"
        echo "OTHER_SUFFIX=${OTHER_SUFFIX}" >> "${GITHUB_ENV}"

    - name: Restore build caches (ccache)
      if: inputs.runner != 'self-hosted'
      # One entry carrying both ccache dirs (9.5G cap total vs the repo's
      # 10 GB quota; GitHub's LRU evicts older versions as new ones save).
      # A cold run saves a fresh entry at the end; the next run restores it.
      # The OF dir lives under out/: Soong runs hermetic host actions in a
      # sandbox with the source tree read-only, and ccache's cache-dir write
      # trips EROFS there (runs 39006228739, 39012647989 — external/icu host
      # modules). out/ is the sandbox-writable area, so out/ccache-of works
      # and persists. The kernel make build has no sandbox; its dir stays at
      # the workspace root.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, pinned 2026-10-17 (node24 + ESM: silences the deprecations)
      with:
        path: |
          ${{ github.workspace }}/OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/ccache-of
          ${{ github.workspace }}/ccache
        key: ccache-${{ env.MANIFEST_BRANCH }}-v1-${{ github.run_id }}
        restore-keys: |
          ccache-${{ env.MANIFEST_BRANCH }}-v1-

    - name: Clean-up
      if: inputs.runner != 'self-hosted'
      uses: rokibhasansagar/slimhub_actions@0d4a750185d9ebd968a2df7cfd03bd313f1e93b3 # v25.42.5, pinned 2026-10-17

    - name: Swap Space (zram first, disk swap on the second disk)
      if: inputs.runner != 'self-hosted'
      # Memory-pressure mitigations (2026-10-18): the runner lost
      # communication three times because Soong's analysis is the build's
      # memory peak on a 4-core/15 GB runner. Put the disk swap on /mnt (a
      # separate device from the build's out/) so swap I/O stops competing
      # with the build, and give it a zram swap at higher priority so the
      # common pressure is absorbed in compressed RAM without disk I/O at
      # all. Both are mitigations, not a root-cause fix - the root fix is a
      # bigger machine (self-hosted runner).
      run: |
        set -euo pipefail
        SWAPFILE=/swapfile
        if [ "$(stat -c %d /mnt)" != "$(stat -c %d /)" ]; then
          SWAPFILE=/mnt/swapfile
        fi
        sudo swapoff -a || true
        sudo rm -f /swapfile /mnt/swapfile
        sudo fallocate -l 24G "${SWAPFILE}" || sudo dd if=/dev/zero of="${SWAPFILE}" bs=1M count=24576 status=none
        sudo chmod 600 "${SWAPFILE}"
        sudo mkswap -q "${SWAPFILE}" >/dev/null
        sudo swapon -p 10 "${SWAPFILE}"
        if sudo modprobe zram 2>/dev/null && [ -e /dev/zram0 ]; then
          echo 6G | sudo tee /sys/block/zram0/disksize >/dev/null
          sudo mkswap -q /dev/zram0 >/dev/null
          sudo swapon -p 100 /dev/zram0
          echo "zram swap active (6G, priority 100)"
        else
          echo "::warning::zram unavailable on this image - disk swap only"
        fi
        echo "disk swap: ${SWAPFILE}"
        swapon --show
        df -h / /mnt | tail -2

    - name: Tune memory for the analysis phase
      if: inputs.runner != 'self-hosted'
      # 2026-10-18: two runs died with "The hosted runner lost communication
      # with the server" 42-48 min into Building OrangeFox - exactly Soong's
      # long silent analysis, the memory peak of the whole build. The swap
      # file lives on the same disk as the build, so heavy swapping starves
      # the runner agent. Swap late (keep hot pages in RAM) and take the
      # agent out of the OOM victim pool so a spike kills a build process
      # (visible, retryable) instead of the process that reports the job.
      run: |
        set -euo pipefail
        # swappiness must match the swap that actually exists. zram at
        # priority 100 (fast, RAM-backed) makes swapping cheap -> swap
        # freely (100). Without zram - the module is absent on the runner
        # image, the step logs the fallback - the only swap is the disk
        # file, and a high swappiness thrashes it: keep pages resident
        # instead (10, the pre-2026-10-18 value; run 39163399606 measured
        # the regression).
        if swapon --show | grep -q zram; then
          sudo sysctl -w vm.swappiness=100
        else
          sudo sysctl -w vm.swappiness=10
        fi
        for p in $(pgrep -f 'Runner\.' || true); do
          echo -1000 | sudo tee "/proc/${p}/oom_score_adj" >/dev/null || true
        done
        echo "swappiness=$(cat /proc/sys/vm/swappiness)"
        ps -eo pid,comm,oom_score_adj | grep -E 'Runner\.' || true

    - name: Build Environment
      if: inputs.runner != 'self-hosted'
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq ccache
        git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      env:
        GH_ACTOR: ${{ github.actor }}
        GH_ACTOR_ID: ${{ github.actor_id }}
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
        cd "${GITHUB_WORKSPACE}/OrangeFox"
        git config --global user.name "${GH_ACTOR}"
        git config --global user.email "${GH_ACTOR_ID}+${GH_ACTOR}@users.noreply.github.com"
        git config --global --add safe.directory '*'
        rm -rf sync
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        # repo sync's -j is clone-job concurrency (network-bound), not core
        # count; the upstream script hardcodes -j4 for fox_16.0. Patch it to
        # the requested value for A/B measurement and fail loud if the
        # expected upstream line disappeared.
        SYNC_JOBS_IN="${{ inputs.sync_jobs }}"
        [ -z "${SYNC_JOBS_IN}" ] && SYNC_JOBS_IN=8
        if [[ "${SYNC_JOBS_IN}" != "4" ]]; then
          if grep -q "repo sync -c -j4 --no-clone-bundle --no-tags" orangefox_sync.sh; then
            sed -i "s/repo sync -c -j4 --no-clone-bundle --no-tags/repo sync -c -j${SYNC_JOBS_IN} --no-clone-bundle --no-tags/" orangefox_sync.sh
            echo "patched repo sync jobs to ${SYNC_JOBS_IN}:"
            grep -n "repo sync -c -j" orangefox_sync.sh
          else
            echo "::error::expected 'repo sync -c -j4' line not found in orangefox_sync.sh - upstream changed, review manually."
            exit 1
          fi
        fi
        # Upstream's 2026-10-18 fox.xml commit (eb1e5d7) adds three projects
        # that anonymous builds cannot fetch (private/unpublished:
        # external/libarchive, external/libfuse3, prebuilts/fox-go) and a
        # manifest-level external/rclone that collides with the device tree's
        # own rclone clone (twrp.dependencies). Build from the pinned
        # public-good snapshot (2026-10-01) in giou/Manifest instead; the pin
        # lives in that repo's fox_16.0 branch, so repo sync cannot undo it.
        # shortcut: drop this once upstream publishes those projects and the
        # dt stops cloning rclone/libfuse itself.
        if grep -q "https://gitlab.com/OrangeFox/Manifest.git" orangefox_sync.sh; then
          sed -i "s#https://gitlab.com/OrangeFox/Manifest.git#https://github.com/giou/Manifest.git#" orangefox_sync.sh
          grep -n "Manifest.git" orangefox_sync.sh
        else
          echo "::error::expected the OrangeFox Manifest URL in orangefox_sync.sh - upstream changed, review manually."
          exit 1
        fi
        # Self-hosted only, no-op on hosted (fresh workspace has no .repo):
        # previous runs replaced some repo projects with plain git clones
        # (Override forked sources, Clone TWRP dependencies). repo expects its
        # own .git *file* pointing into .repo/projects and fails checkout on a
        # foreign .git *directory* ("Cannot checkout ...: unsupported .git").
        # Remove those working trees so repo restores them from .repo/projects;
        # the later steps re-apply the clones. Data-driven - no hardcoded list.
        FOX_TREE="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        if [ -d "${FOX_TREE}/.repo" ]; then
          find "${FOX_TREE}" -name .repo -prune -o -name .git -type d -printf '%h\n' 2>/dev/null \
            | while read -r d; do
                echo "foreign clone where repo expects its checkout, restoring: ${d#${FOX_TREE}/}"
                rm -rf "${d}"
              done
        fi
        # Upstream hosts (gitlab.com, android.googlesource.com) flake with
        # transient 503s mid-sync (killed two runs: vendor/recovery, then
        # libbootloader). repo sync resumes partial checkouts, so re-running
        # the script is a safe resume - retry with backoff before failing.
        attempt=1; max_attempts=4
        while [[ ${attempt} -le ${max_attempts} ]]; do
          echo "Manifest sync attempt ${attempt}/${max_attempts} ..."
          if ./orangefox_sync.sh --branch "${MANIFEST_BRANCH}" --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"; then
            echo "Manifest sync succeeded on attempt ${attempt}."
            break
          fi
          if [[ ${attempt} -eq ${max_attempts} ]]; then
            echo "::error::Manifest sync failed after ${max_attempts} attempts."
            exit 1
          fi
          wait_s=$((attempt * 90))
          echo "Sync failed (likely transient 503), sleeping ${wait_s}s before retry ..."
          sleep ${wait_s}
          attempt=$((attempt + 1))
        done

    - name: Place Device Tree
      run: |
        set -euo pipefail
        FOX_ROOT="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        if [[ ! -d "${FOX_ROOT}" ]]; then
          echo "::error::Manifest checkout not found at ${FOX_ROOT}. Set-up Manifest probably failed."
          exit 1
        fi
        # This workflow lives in the device tree itself: export the exact commit
        # this run was triggered on into the manifest (a plain copy would try to
        # copy the manifest into itself - the checkout root contains it).
        # COMMIT_ID is GITHUB_SHA by construction.
        rm -rf "${FOX_ROOT}/${DEVICE_PATH}"
        mkdir -p "${FOX_ROOT}/${DEVICE_PATH}"
        git -C "${GITHUB_WORKSPACE}" archive "${GITHUB_SHA}" | tar -x -C "${FOX_ROOT}/${DEVICE_PATH}"
        echo "COMMIT_ID=${GITHUB_SHA}" >> "${GITHUB_ENV}"
        echo "Tree placed at ${DEVICE_PATH} from ${GITHUB_SHA} (${GITHUB_REF_NAME})"

    - name: Fetch Magisk 31 addon zip
      run: |
        set -euo pipefail
        DEST="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/${DEVICE_PATH}/magisk"
        mkdir -p "${DEST}"
        curl -fSL --retry 3 -o "${DEST}/Magisk-v31.0.zip" \
          "https://github.com/topjohnwu/Magisk/releases/download/v31.0/Magisk-v31.0.apk"
        # Verify the exact upstream bytes; a replaced release asset must fail, not ship.
        echo "2c8a488b9a5293e578e95ae4f07e3c57aba4feec4a52ca4dd852a2692d6dd4e8  ${DEST}/Magisk-v31.0.zip" | sha256sum -c -
        ls -la "${DEST}"
        unzip -l "${DEST}/Magisk-v31.0.zip" | grep -E "util_functions|META-INF/com/google" | head -n 3

    - name: Clone TWRP dependencies
      run: |
        set -euo pipefail
        FOX_ROOT="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        cd "${FOX_ROOT}"
        DEPS_FILE="./${DEVICE_PATH}/twrp.dependencies"
        if [[ ! -f "${DEPS_FILE}" ]]; then
          echo "No twrp.dependencies, skipping."
          exit 0
        fi
        python3 - "${DEPS_FILE}" <<'EOF'
        import json, os, subprocess, sys
        REMOTES = {
          "github": "https://github.com",
          "gitlab": "https://gitlab.com",
          "LineageOS": "https://github.com/LineageOS",
          "OrangeFox": "https://gitlab.com/OrangeFox",
          "TeamWin": "https://github.com/TeamWin",
        }
        deps = json.load(open(sys.argv[1]))
        for d in deps:
          remote = d["remote"]
          base = REMOTES.get(remote, remote)
          url = base.rstrip("/") + "/" + d["repository"]
          if not url.endswith(".git"):
            url += ".git"
          path, branch = d["target_path"], d.get("branch", "master")
          if os.path.exists(path):
            print(f"Removing pre-existing {path} ...")
            subprocess.run(["rm", "-rf", path], check=True)
          os.makedirs(os.path.dirname(path), exist_ok=True)
          print(f"Cloning {url} (branch: {branch}) into {path} ...")
          subprocess.run(["git", "clone", "--depth=1", "--single-branch",
                          "--branch", branch, url, path], check=True)
        print("TWRP dependencies cloned.")
        EOF

    - name: Override forked sources (vold, bootable/recovery, foxcli)
      # Our forks replace the synced copies wholesale: deterministic, shallow,
      # auditable, and nothing re-syncs afterwards so .repo staleness is
      # harmless. system/vold carries the CE re-apply change (fscrypt's
      # per-superblock keyring dies with the /data mount -> ciphertext names on
      # remount); bootable/recovery carries the apollon fixes;
      # external/foxcli carries the `internal unlock` subcommand the upstream
      # CLI enum lacks (the engine has the verb since R12.0_16).
      # Entry format: <tree path>|<repo>|<branch>
      run: |
        set -euo pipefail
        FOX_ROOT="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        cd "${FOX_ROOT}"
        while IFS='|' read -r dir repo branch; do
          [[ -n "${dir}" ]] || continue
          if [[ ! -d "${dir}" ]]; then
            echo "::error::${dir} missing after sync - manifest layout changed, review manually."
            exit 1
          fi
          echo "${dir}: upstream HEAD before override:"
          git -C "${dir}" rev-parse HEAD
          rm -rf "${dir}"
          git clone --depth=1 --single-branch --branch "${branch}" "${repo}" "${dir}"
          echo "${dir}: override HEAD now:"
          git -C "${dir}" rev-parse HEAD
          git -C "${dir}" log --oneline -3
        done <<'EOF'
        system/vold|https://github.com/giou/android_system_vold|fox_16.0-apollon
        bootable/recovery|https://github.com/giou/Recovery.git|fox_16.0-apollon-wlan
        external/foxcli|https://github.com/giou/foxcli|master
        EOF
        # Record the fork HEAD for the auto-generated release notes (each
        # published body carries dt+fork markers so the next build can diff
        # exactly what changed since).
        echo "FORK_HEAD=$(git -C "${FOX_ROOT}/bootable/recovery" rev-parse HEAD)" >> "${GITHUB_ENV}"
        echo "fork HEAD for release notes: $(git -C "${FOX_ROOT}/bootable/recovery" rev-parse HEAD)"

    - name: Patch adbd TLS server to honor the requested port
      # The AOSP daemon binds its paired-ADB TLS server on port 0 (random) by
      # design: adb_wifi.cpp only watches persist.adb.tls_server.enable. Make
      # it read service.adb.tls_server.port so the recovery's fixed port
      # request (fox_adbd StartSecure) is honored. Fail loud if the source
      # line ever moves, so the next sync cannot silently revert the port to
      # random.
      run: |
        set -euo pipefail
        ADBWIFI="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/packages/modules/adb/daemon/adb_wifi.cpp"
        if [[ ! -f "${ADBWIFI}" ]]; then
          echo "::error::${ADBWIFI} missing - adb module layout changed, review manually."
          exit 1
        fi
        sed -i 's|sTlsServer = new TlsServer(0);|sTlsServer = new TlsServer(android::base::GetIntProperty("service.adb.tls_server.port", 0));|' "${ADBWIFI}"
        grep -q 'GetIntProperty("service.adb.tls_server.port"' "${ADBWIFI}" \
          || { echo "::error::adbd TLS port patch did not apply - source changed, review manually."; exit 1; }
        echo "adbd TLS port patch applied:"
        grep -n 'new TlsServer' "${ADBWIFI}"

    - name: Build the kernel from the apollon fork
      run: |
        set -eo pipefail
        echo "runner parallelism: $(nproc) available CPUs, $(nproc --all) installed"
        FOX_ROOT="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        KERNEL_REPO="https://github.com/giou/android_kernel_xiaomi_sm8250"
        KERNEL_BRANCH="lineage-24.0-apollon"
        KSRC="${RUNNER_TEMP}/kernel-src"

        # kernel build deps the runner image does not ship (self-hosted has
        # them from its setup; skipping there also drops a network dependency
        # from the kernel step)
        if [[ "${{ inputs.runner }}" != "self-hosted" ]]; then
          sudo apt-get install -y -qq flex bison bc libssl-dev >/dev/null
        fi

        rm -rf "${KSRC}"
        git clone --depth=1 --single-branch --branch "${KERNEL_BRANCH}" \
          "${KERNEL_REPO}" "${KSRC}"
        cd "${KSRC}"

        CLANG_DIR="${FOX_ROOT}/prebuilts/clang/host/linux-x86/clang-r547379"
        if [ ! -x "${CLANG_DIR}/bin/clang" ]; then
          echo "::error::clang-r547379 not found at ${CLANG_DIR} - tree toolchain changed, review manually."
          exit 1
        fi
        export PATH="${CLANG_DIR}/bin:${PATH}"
        clang --version | head -n 1

        # ccache for the kernel compiles: capped at 1G (the measured store is
        # ~754M) so it plus the OF cache fit the repo's 10 GB quota. The dir is
        # restored/saved by the ccache cache step; the probe only adds stats.
        export CCACHE_DIR="${GITHUB_WORKSPACE}/ccache"
        export CCACHE_COMPRESS=1
        export CCACHE_MAXSIZE=${{ inputs.runner == 'self-hosted' && '20G' || '1000M' }}
        # Fresh repo syncs give the prebuilt clang a new mtime every run,
        # which would fail ccache's default mtime compiler check and zero the
        # warm hit rate. Pin compiler identity to the toolchain version string
        # instead (it changes only when Lineage actually bumps the prebuilt).
        export CCACHE_COMPILERCHECK="string:$("${CLANG_DIR}/bin/clang" --version | head -n 1)"
        ccache -z >/dev/null 2>&1 || true
        KERNEL_CC="clang"
        if command -v ccache >/dev/null 2>&1; then
          KERNEL_CC="ccache clang"
          echo "ccache: $(ccache --version | head -n 1) (wrapping CC)"
        fi

        # LineageOS's config set for apollon: the three entries in
        # sm8250-common's BoardConfigCommon.mk, plus the fragment apollon's
        # BoardConfig appends. That last one carries the Xiaomi board symbol,
        # which is what supplies the touchscreen driver recovery needs.
        #
        # LLVM=1 belongs on the config phase too, not only on the Image build:
        # LTO_CLANG and CFI_CLANG depend on CC_IS_CLANG && LD_IS_LLD, so a
        # config phase run without it silently drops both and we would ship a
        # non-LTO, non-CFI kernel instead of LOS's.
        make -s O=out ARCH=arm64 LLVM=1 vendor/kona-perf_defconfig
        scripts/kconfig/merge_config.sh -m -O out out/.config \
          arch/arm64/configs/vendor/debugfs.config \
          arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
          arch/arm64/configs/vendor/xiaomi/apollo.config >/dev/null
        make -s O=out ARCH=arm64 LLVM=1 olddefconfig

        # Fail loud on symbols a wrong config set would silently lose.
        grep -E "^CONFIG_(LTO_NONE|LTO_CLANG|THINLTO|CFI_CLANG)" out/.config
        for sym in MACH_XIAOMI_APOLLO MACH_XIAOMI_SM8250 \
                   TOUCHSCREEN_NT36xxx_HOSTDL_SPI LTO_CLANG CFI_CLANG; do
          grep -q "^CONFIG_${sym}=y" out/.config \
            || { echo "::error::CONFIG_${sym} missing from the merged config - wrong fragments, review manually."; exit 1; }
        done

        make O=out ARCH=arm64 LLVM=1 CC="${KERNEL_CC}" -j"$(nproc)" Image

        strings out/arch/arm64/boot/Image | grep -m1 "Linux version" || true

        echo "== kernel ccache report =="
        ccache -s -v 2>/dev/null || true
        echo "ccache dir size:"
        du -sh "${CCACHE_DIR}" 2>/dev/null || echo "(no ccache dir)"
        echo "ccache files: $(find "${CCACHE_DIR}" -type f 2>/dev/null | wc -l)"

        install -m 644 out/arch/arm64/boot/Image \
          "${FOX_ROOT}/${DEVICE_PATH}/prebuilt/apollon/kernel"
        ls -l "${FOX_ROOT}/${DEVICE_PATH}/prebuilt/apollon/kernel"
        echo "kernel built from ${KERNEL_REPO}@${KERNEL_BRANCH}, installed over the prebuilt"

        # Free the kernel workspace before the platform build (1.5G source + out/):
        # the two memory peaks stay sequential, and so do the disk peaks.
        du -sh "${KSRC}" 2>/dev/null || true
        rm -rf "${KSRC}"
        df -h "${GITHUB_WORKSPACE}" | tail -n 1

    - name: Building OrangeFox
      if: ${{ inputs.probe != 'kernel-ccache' }}
      env:
        # Soong's analysis is one Go process whose heap peaks late; halving
        # GOGC caps that peak (a little slower) so the 15 GB runner does not
        # swap-thrash into a lost-runner (see the memory-tuning step above).
        GOGC: '50'
        # Absolute path to the Magisk 31 addon zip fetched above. Env beats
        # the tree's "?=" default; falls back to it (or upstream 30.7) if unset.
        FOX_USE_SPECIFIC_MAGISK_ZIP: ${{ github.workspace }}/OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}/magisk/Magisk-v31.0.zip
        # Tree-mk FOX_ vars don't reliably reach the vendor packaging script
        # (v11: Magisk override via env worked, AromaFM drop via tree did not),
        # so pass this one through the same proven env channel.
        FOX_DELETE_AROMAFM: '1'
      run: |
        # NOTE: Do NOT use `set -u` here - AOSP build/envsetup.sh is not
        # nounset-clean (references $TOP, $ZSH_VERSION unbound) and fails
        # immediately under `set -u` with "TOP: unbound variable".
        set -eo pipefail
        echo "runner parallelism: $(nproc) available CPUs; mka uses the tree's default job count (the CPU count)"
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        # OrangeFox build ccache, always on: capped at 8.5G so it plus the
        # kernel's 1G cache fit the repo's 10 GB cache quota (old versions are
        # churned out by GitHub's LRU). Exported via GITHUB_ENV so the second
        # (dual-build) variant shares the cache. probe=of-ccache only adds the
        # stats report at the end.
        # The dir MUST live under out/: Soong runs hermetic host actions in a
        # sandbox with the source tree read-only, and ccache's first write
        # there dies with EROFS (fatal to the build). out/ is writable inside
        # the sandbox, so the cache works and keeps working.
        export USE_CCACHE=1
        export CCACHE_EXEC="$(command -v ccache)"
        export CCACHE_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/out/ccache-of"
        export CCACHE_COMPRESS=1
        # self-hosted: the cache is a persistent directory on the runner's own
        # disk, so let it hold the whole build (hosted keeps the repo's 10 GB
        # actions/cache quota in mind).
        export CCACHE_MAXSIZE=${{ inputs.runner == 'self-hosted' && '120G' || '8500M' }}
        # Same mtime-churn problem as the kernel step (fresh sync each run):
        # pin compiler identity to the tree prebuilt's version string.
        OF_CLANG="$(echo "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"/prebuilts/clang/host/linux-x86/clang-*/bin/clang | awk '{print $1}')"
        export CCACHE_COMPILERCHECK="string:$("${OF_CLANG}" --version | head -n 1)"
        echo "USE_CCACHE=1" >> "${GITHUB_ENV}"
        echo "CCACHE_EXEC=${CCACHE_EXEC}" >> "${GITHUB_ENV}"
        echo "CCACHE_DIR=${CCACHE_DIR}" >> "${GITHUB_ENV}"
        echo "CCACHE_COMPRESS=1" >> "${GITHUB_ENV}"
        echo "CCACHE_MAXSIZE=${{ inputs.runner == 'self-hosted' && '120G' || '8500M' }}" >> "${GITHUB_ENV}"
        echo "CCACHE_COMPILERCHECK=${CCACHE_COMPILERCHECK}" >> "${GITHUB_ENV}"
        echo "of ccache: using ${CCACHE_DIR} (cap 8500M)"
        echo "of ccache: restored entries: $(find "${CCACHE_DIR}" -type f 2>/dev/null | wc -l)"
        set +e +u
        set +o pipefail
        # shellcheck disable=SC1091
        source build/envsetup.sh
        set -e
        # 16.0 is the only manifest this builder supports; it needs the
        # release-qualified combo: bp2a for the android-16.0.0 base.
        lunch "twrp_${DEVICE_NAME}-bp2a-eng"
        # Memory guard (2026-10-18): keep the build's peak inside a cgroup so
        # the kernel throttles it (memory.high) and, past the hard limits,
        # OOM-kills a build process inside the cgroup - a visible, logged,
        # retryable failure - instead of thrashing the whole VM until the
        # runner agent stalls and GitHub declares the runner lost.
        if sudo mkdir -p /sys/fs/cgroup/ofbuild \
           && echo 13G | sudo tee /sys/fs/cgroup/ofbuild/memory.high >/dev/null \
           && echo 15G | sudo tee /sys/fs/cgroup/ofbuild/memory.max >/dev/null \
           && echo 10G | sudo tee /sys/fs/cgroup/ofbuild/memory.swap.max >/dev/null \
           && echo $$ | sudo tee /sys/fs/cgroup/ofbuild/cgroup.procs >/dev/null; then
          echo "build cgroup: high=13G max=15G swap.max=10G"
        else
          echo "::warning::cgroup limits unavailable - running unguarded"
        fi
        mka adbd "${BUILD_TARGET}image"

        if [[ "${{ inputs.probe }}" == "of-ccache" ]]; then
          echo "== of build ccache report (primary) =="
          ccache -s -v 2>/dev/null || true
          echo "ccache dir size:"
          du -sh "${CCACHE_DIR:-/nonexistent}" 2>/dev/null || echo "(no ccache dir)"
          echo "ccache files: $(find "${CCACHE_DIR:-/nonexistent}" -type f 2>/dev/null | wc -l)"
        fi

    - name: Assert NAS binaries in the wlan recovery image
      if: ${{ inputs.probe != 'kernel-ccache' }}
      # A wlan recovery drives OrangeFox "Network Storage" through rclone +
      # fusermount3. Both come from external/rclone + external/libfuse via
      # twrp.dependencies; when either was missing the build still went green
      # and shipped a recovery whose NAS mount can never start (R12.0_9 ..
      # R12.0_14). Fail loud instead of shipping it again.
      run: |
        set -euo pipefail
        OUT_DIR="OrangeFox/fox_${MANIFEST_BRANCH}/out/target/product/${DEVICE_NAME}"
        BIN_DIR="${OUT_DIR}/recovery/root/system/bin"
        # Variant from the build inputs, not a ramdisk-content proxy: the old
        # ttyd check would silently skip (or falsely fail) if the variants'
        # contents ever shifted.
        if [[ "${VARIANT_SUFFIX}" != "-wlan" ]]; then
          echo "primary variant is not wlan: NAS binaries are not part of this variant, skipping."
          exit 0
        fi
        ls -l "${BIN_DIR}" | grep -E "rclone|fusermount3" || true
        for b in rclone fusermount3; do
          if [[ ! -x "${BIN_DIR}/${b}" ]]; then
            echo "::error::${b} missing from the wlan recovery ramdisk - check twrp.dependencies (external/rclone, external/libfuse) and the TWRP_REQUIRED_MODULES list in orangefox.mk."
            exit 1
          fi
        done
        echo "NAS binaries present: rclone, fusermount3"

    - name: Diagnose build failure
      # Failure-only observability: disk/memory + tool provenance for the next
      # triage. Cheap, runs only when a build step fails.
      if: failure()
      run: |
        echo "=== disk ==="; df -h / || true
        echo "=== memory ==="; free -h || true
        echo "=== cp ==="; which cp || true; cp --version 2>&1 | head -n 1 || true
        echo "=== out/error.log (if present) ==="
        tail -n 30 "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/out/error.log" 2>/dev/null || echo "(no out/error.log)"

    - name: Set Release Properties
      run: |
        set -euo pipefail
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> "${GITHUB_ENV}"
        DEVICE_TREE_URL="${DEVICE_TREE}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> "${GITHUB_ENV}"

        # The tree's patch version is what the recovery banner shows as
        # R12.0_<n>. Two builds on one day otherwise get identical release
        # titles and identical asset names, which is how the previous build
        # got flashed by mistake.
        FOX_MK=$(ls "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/${DEVICE_PATH}"/fox_*.mk 2>/dev/null | head -n 1 || true)
        FOX_BUILD=$(grep -m1 -oE 'FOX_MAINTAINER_PATCH_VERSION[[:space:]]*:=[[:space:]]*[0-9]+' "${FOX_MK:-/dev/null}" 2>/dev/null | grep -oE '[0-9]+$' || true)
        echo "BUILD_VER=${FOX_BUILD:-0}" >> "${GITHUB_ENV}"
        echo "Recovery banner will read: R12.0_${FOX_BUILD:-0}"

        if [ -z "${FOX_BUILD}" ]; then
          echo "::warning::could not read FOX_MAINTAINER_PATCH_VERSION from ${DEVICE_PATH}/fox_*.mk - the release title will not carry a build number."
        fi

    - name: Rename assets with maintainer tag
      if: ${{ inputs.probe == 'none' }}
      # Maintainer patch version rides the banner (R12.0_<n>) and the release
      # title, but the vendor packaging script names the files without it
      # (OrangeFox-R12.0-Unofficial-apollon.*). Rename so the files carry it:
      # OrangeFox-R12.0_<n>-Unofficial-apollon.*. Fail loud on unexpected names.
      run: |
        set -euo pipefail
        if [[ -z "${BUILD_VER:-}" || "${BUILD_VER}" == "0" ]]; then
          echo "::error::BUILD_VER missing - Set Release Properties did not read FOX_MAINTAINER_PATCH_VERSION."
          exit 1
        fi
        OUT_DIR="OrangeFox/fox_${MANIFEST_BRANCH}/out/target/product/${DEVICE_NAME}"
        ls -lh "${OUT_DIR}"
        renamed=0
        for f in "${OUT_DIR}"/OrangeFox*.img "${OUT_DIR}"/OrangeFox*.zip; do
          [[ -e "${f}" ]] || continue
          base="$(basename "${f}")"
          if [[ "${base}" != OrangeFox-R12.0-Unofficial-* ]]; then
            echo "::error::Unexpected asset name '${base}' - vendor naming changed, review manually."
            exit 1
          fi
          rest="${base#OrangeFox-R12.0-Unofficial-}"
          ext="${rest##*.}"
          stem="${rest%.*}"
          new="OrangeFox-R12.0_${BUILD_VER}-Unofficial-${stem}${VARIANT_SUFFIX}.${ext}"
          mv "${f}" "${OUT_DIR}/${new}"
          echo "${base} -> ${new}"
          renamed=$((renamed + 1))
        done
        if [[ "${renamed}" -eq 0 ]]; then
          echo "::error::No OrangeFox assets found to rename in ${OUT_DIR}."
          exit 1
        fi
        ls -lh "${OUT_DIR}"/OrangeFox*

    - name: Swap to the other variant
      if: ${{ inputs.build == 'both' && inputs.probe != 'kernel-ccache' }}
      # Same runner, same workspace: the manifest and the kernel are shared,
      # only the device tree files and bootable/recovery swap -> the second
      # build is incremental (no from-scratch compile).
      run: |
        set -euo pipefail
        FOX_ROOT="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        OUT_DIR="${FOX_ROOT}/out/target/product/${DEVICE_NAME}"
        # The freshly built kernel and the fetched Magisk addon are
        # variant-independent; the sibling tree carries its own (stale)
        # prebuilt kernel and no fetched Magisk zip, so carry both over.
        mkdir -p "${RUNNER_TEMP}/carry"
        cp "${FOX_ROOT}/${DEVICE_PATH}/prebuilt/apollon/kernel" "${RUNNER_TEMP}/carry/kernel"
        cp "${FOX_ROOT}/${DEVICE_PATH}/magisk/Magisk-v31.0.zip" "${RUNNER_TEMP}/carry/Magisk-v31.0.zip"
        cd "${GITHUB_WORKSPACE}"
        git fetch --depth=1 origin "${OTHER_DT_BRANCH}"
        rm -rf "${FOX_ROOT}/${DEVICE_PATH}"
        mkdir -p "${FOX_ROOT}/${DEVICE_PATH}"
        git archive FETCH_HEAD | tar -x -C "${FOX_ROOT}/${DEVICE_PATH}"
        install -m 644 "${RUNNER_TEMP}/carry/kernel" "${FOX_ROOT}/${DEVICE_PATH}/prebuilt/apollon/kernel"
        mkdir -p "${FOX_ROOT}/${DEVICE_PATH}/magisk"
        install -m 644 "${RUNNER_TEMP}/carry/Magisk-v31.0.zip" "${FOX_ROOT}/${DEVICE_PATH}/magisk/Magisk-v31.0.zip"
        cd "${FOX_ROOT}"
        rm -rf bootable/recovery
        git clone --depth=1 --single-branch --branch "${OTHER_FORK_BRANCH}" \
          https://github.com/giou/Recovery.git bootable/recovery
        # Drop the primary variant's ramdisk staging: install rules never remove
        # files the sibling variant placed there (e.g. wlan binaries would ride
        # into the mainline ramdisk); the staging is cheap to regenerate.
        rm -rf "${OUT_DIR}/recovery/root"
        echo "Swapped to ${OTHER_VARIANT}: dt=${OTHER_DT_BRANCH} fork=${OTHER_FORK_BRANCH}"
        git -C bootable/recovery log --oneline -2

    - name: Build the other variant (incremental)
      if: ${{ inputs.build == 'both' && inputs.probe != 'kernel-ccache' }}
      env:
        FOX_USE_SPECIFIC_MAGISK_ZIP: ${{ github.workspace }}/OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}/magisk/Magisk-v31.0.zip
        FOX_DELETE_AROMAFM: '1'
      run: |
        set -eo pipefail
        cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        set +e +u
        set +o pipefail
        source build/envsetup.sh
        set -e
        lunch "twrp_${DEVICE_NAME}-bp2a-eng"
        # Same memory guard as the primary build (see above).
        if sudo mkdir -p /sys/fs/cgroup/ofbuild \
           && echo 13G | sudo tee /sys/fs/cgroup/ofbuild/memory.high >/dev/null \
           && echo 15G | sudo tee /sys/fs/cgroup/ofbuild/memory.max >/dev/null \
           && echo 10G | sudo tee /sys/fs/cgroup/ofbuild/memory.swap.max >/dev/null \
           && echo $$ | sudo tee /sys/fs/cgroup/ofbuild/cgroup.procs >/dev/null; then
          echo "build cgroup: high=13G max=15G swap.max=10G"
        else
          echo "::warning::cgroup limits unavailable - running unguarded"
        fi
        mka adbd "${BUILD_TARGET}image"

        if [[ "${{ inputs.probe }}" == "of-ccache" ]]; then
          echo "== of build ccache report (second variant, cumulative) =="
          ccache -s -v 2>/dev/null || true
          echo "ccache files: $(find "${CCACHE_DIR:-/nonexistent}" -type f 2>/dev/null | wc -l)"
        fi

    - name: Assert NAS binaries in the wlan recovery image (other variant)
      if: ${{ inputs.build == 'both' && inputs.probe != 'kernel-ccache' }}
      run: |
        set -euo pipefail
        OUT_DIR="OrangeFox/fox_${MANIFEST_BRANCH}/out/target/product/${DEVICE_NAME}"
        BIN_DIR="${OUT_DIR}/recovery/root/system/bin"
        # Same variant-from-inputs rule as the primary assert (see above).
        if [[ "${OTHER_SUFFIX}" != "-wlan" ]]; then
          echo "other variant is not wlan: NAS binaries are not part of it, skipping."
          exit 0
        fi
        ls -l "${BIN_DIR}" | grep -E "rclone|fusermount3" || true
        for b in rclone fusermount3; do
          if [[ ! -x "${BIN_DIR}/${b}" ]]; then
            echo "::error::${b} missing from the wlan recovery ramdisk of the other variant - check twrp.dependencies (external/rclone, external/libfuse) and the TWRP_REQUIRED_MODULES list in orangefox.mk."
            exit 1
          fi
        done
        echo "NAS binaries present: rclone, fusermount3"

    - name: Rename the other variant assets
      if: ${{ inputs.build == 'both' && inputs.probe != 'kernel-ccache' }}
      run: |
        set -euo pipefail
        OUT_DIR="OrangeFox/fox_${MANIFEST_BRANCH}/out/target/product/${DEVICE_NAME}"
        renamed=0
        for f in "${OUT_DIR}"/OrangeFox*.img "${OUT_DIR}"/OrangeFox*.zip; do
          [[ -e "${f}" ]] || continue
          base="$(basename "${f}")"
          if [[ "${base}" != OrangeFox-R12.0-Unofficial-* ]]; then
            echo "skip (already renamed): ${base}"
            continue
          fi
          rest="${base#OrangeFox-R12.0-Unofficial-}"
          ext="${rest##*.}"
          stem="${rest%.*}"
          new="OrangeFox-R12.0_${BUILD_VER}-Unofficial-${stem}${OTHER_SUFFIX}.${ext}"
          mv "${f}" "${OUT_DIR}/${new}"
          echo "${base} -> ${new}"
          renamed=$((renamed + 1))
        done
        if [[ "${renamed}" -eq 0 ]]; then
          echo "::error::No ${OTHER_VARIANT} assets found to rename in ${OUT_DIR}."
          exit 1
        fi
        ls -lh "${OUT_DIR}"/OrangeFox*

    - name: Compose release notes
      # Fully automatic: static template from the tree (RELEASE_NOTES.md) +
      # placeholders, plus a "Changes in this build" section diffed against
      # the previous release's embedded dt/fork markers. No human edit step.
      id: compose-notes
      if: ${{ inputs.probe == 'none' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        REPO="${{ github.repository }}"
        TPL="${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}/${DEVICE_PATH}/RELEASE_NOTES.md"
        [[ -f "${TPL}" ]] || { echo "::error::RELEASE_NOTES.md missing at ${TPL}."; exit 1; }

        # Previous release anchors: each published body embeds its source SHAs.
        PREV_TAG="$(gh release list -R "${REPO}" --limit 10 --json tagName,createdAt --jq 'sort_by(.createdAt) | last(.[]).tagName' 2>/dev/null || true)"
        PREV_BODY="$(gh release view "${PREV_TAG}" -R "${REPO}" --json body --jq '.body' 2>/dev/null || true)"
        MARKERS="$(printf '%s' "${PREV_BODY}" | grep -oE '<!-- dt-sha:[0-9a-f]{40} fork-sha:[0-9a-f]{40} -->' || true)"
        PREV_DT="$(printf '%s' "${MARKERS}" | grep -oE 'dt-sha:[0-9a-f]{40}' | cut -d: -f2 || true)"
        PREV_FORK="$(printf '%s' "${MARKERS}" | grep -oE 'fork-sha:[0-9a-f]{40}' | cut -d: -f2 || true)"

        AUTO_TMP="$(mktemp)"
        {
          echo "### Changes in this build (since release ${PREV_TAG:-unknown})"
          DT_LOG="$(gh api "repos/${REPO}/compare/${PREV_DT}...${COMMIT_ID}" --jq '.commits[] | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"' 2>/dev/null || true)"
          if [[ -n "${PREV_DT}" && -n "${DT_LOG}" ]]; then
            echo "device tree:"
            printf '%s\n' "${DT_LOG}" | head -n 30 || true
          else
            echo "- dt range unavailable (previous release carries no markers); full history applies."
          fi
          FORK_LOG=""
          if [[ -n "${PREV_FORK:-}" && -n "${FORK_HEAD:-}" ]]; then
            FORK_LOG="$(gh api "repos/giou/Recovery/compare/${PREV_FORK}...${FORK_HEAD}" --jq '.commits[] | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"' 2>/dev/null || true)"
          fi
          if [[ -n "${FORK_LOG}" ]]; then
            echo "recovery fork:"
            printf '%s\n' "${FORK_LOG}" | head -n 30 || true
          else
            echo "- fork range unavailable (previous release carries no markers); see fork history."
          fi
          echo "<!-- dt-sha:${COMMIT_ID} fork-sha:${FORK_HEAD:-unknown} -->"
        } > "${AUTO_TMP}"

        COMPOSED="$(mktemp)"
        sed -e "s|%%BUILD_VER%%|${BUILD_VER}|g" \
            -e "s|%%MANIFEST_BRANCH%%|${MANIFEST_BRANCH}|g" \
            -e "s|%%DEVICE_TREE_URL%%|${DEVICE_TREE_URL}|g" \
            -e "s|%%DEVICE_TREE_BRANCH%%|${DEVICE_TREE_BRANCH}|g" \
            -e "s|%%COMMIT_ID%%|${COMMIT_ID}|g" \
            -e "s|%%COMMIT_ID_SHORT%%|$(printf '%s' "${COMMIT_ID}" | cut -c1-7)|g" \
            -e "s|%%FORK_HEAD%%|${FORK_HEAD:-unknown}|g" \
            -e "s|%%FORK_HEAD_SHORT%%|$(printf '%s' "${FORK_HEAD:-unknown}" | cut -c1-7)|g" \
            "${TPL}" > "${COMPOSED}"
        {
          echo "body<<RELEASE_NOTES_EOF"
          python3 - "${COMPOSED}" "${AUTO_TMP}" <<'EOF'
        import sys
        tpl = open(sys.argv[1]).read()
        auto = open(sys.argv[2]).read()
        text = tpl.replace("<!--AUTO-CHANGES-->", auto)
        # An empty Known-issues section is noise: drop the whole block, but
        # only when it is exactly the "(none)" marker (real entries stay).
        text = text.replace("### Known issues\n(none)\n\n", "")
        sys.stdout.write(text)
        EOF
          echo "RELEASE_NOTES_EOF"
        } >> "${GITHUB_OUTPUT}"
        rm -f "${AUTO_TMP}" "${COMPOSED}"

    - name: Upload to Release
      if: ${{ inputs.probe == 'none' }}
      uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3, pinned 2026-10-17
      with:
        files: |
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }} (R12.0_${{ env.BUILD_VER }})
        tag_name: ${{ github.run_id }}
        fail_on_unmatched_files: true
        body: ${{ steps.compose-notes.outputs.body }}
